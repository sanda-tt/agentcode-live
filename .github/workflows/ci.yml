name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:vscode
      - run: npm run package
      - run: npm run package:dsh
      - uses: actions/upload-artifact@v4
        with:
          name: agentcode-live
          path: artifacts/*
